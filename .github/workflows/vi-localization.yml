name: Vietnamese Localization QA

on:
  push:
    branches:
      - vi-localization
    paths:
      - "localization/vi/**"
      - "src/dra/menu.c"
      - "tools/sotn-assets/sotn/string.go"
      - ".github/workflows/vi-localization.yml"
  pull_request:
    paths:
      - "localization/vi/**"
      - "src/dra/menu.c"
      - "tools/sotn-assets/sotn/string.go"
      - ".github/workflows/vi-localization.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Translation and encoding checks (no ROM needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s localization/vi/tests -v
      - name: Source and font coverage audit
        run: python3 localization/vi/tools/audit.py --json
      - name: Full Vietnamese alphabet mapping report
        run: python3 localization/vi/tools/charset.py
      - name: US text-related asset inventory
        run: python3 localization/vi/tools/asset_inventory.py --summary
      - name: Verify checked-in US source-text catalog
        run: python3 localization/vi/tools/source_catalog.py --check localization/vi/us_source_catalog.csv
